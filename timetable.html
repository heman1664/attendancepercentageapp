<!DOCTYPE html>

<html>

<head>

<title>Create Timetable</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
child
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

authDomain: "attendance-tracker-7256b.firebaseapp.com",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com",

projectId: "attendance-tracker-7256b",

storageBucket: "attendance-tracker-7256b.appspot.com",

messagingSenderId: "512459479971",

appId: "1:512459479971:web:3e69c4b1cc84388fce9816"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const sem =
localStorage.getItem("currentSem");


let days =
["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];


let dayIndex=0;


let subjects=[];

let timings=[];

let timetable={};



async function load(){

let s1 = await get(

child(ref(db),

"semesters/"+sem+"/subjects")

);


subjects = [];

s1.forEach(x=>{

subjects.push(x.val().name);

});


let s2 = await get(

child(ref(db),

"semesters/"+sem+"/timings")

);


timings=[];

s2.forEach(x=>{

timings.push(x.val());

});


showDay();

}


load();



function showDay(){

let html="";

document.getElementById("dayTitle").innerText =
days[dayIndex];


timings.forEach((t,i)=>{


if(t.type=="period"){


html +=

"Period "+(i+1)+

"<select id='p"+i+"'>";


subjects.forEach(s=>{

html +=

"<option>"+s+"</option>";

});


html+="</select><br><br>";

}
else{


html +=

"<div class='break'>"+
t.type.toUpperCase()+
"</div>";

}


});


document.getElementById("inputs").innerHTML =
html;

}



window.nextDay=function(){


let day = days[dayIndex];


timetable[day]=[];


timings.forEach((t,i)=>{


if(t.type=="period"){


timetable[day].push(

document.getElementById("p"+i).value

);

}
else{


timetable[day].push(

t.type

);

}


});


dayIndex++;


if(dayIndex>=days.length){


set(

ref(db,
"semesters/"+sem+"/timetable"),

timetable

);


window.location=
"timetable-view.html";


return;

}


showDay();


}

</script>



<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Segoe UI;

background:

linear-gradient(
rgba(70,0,120,0.65),
rgba(30,0,80,0.85)
),

url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

background-size:cover;

}



.container{

width:350px;

padding:35px;

border-radius:20px;

background:rgba(255,255,255,0.1);

backdrop-filter:blur(15px);

color:white;

}



select{

width:100%;

padding:12px;

margin:8px 0;

border-radius:20px;

border:none;

}



button{

width:100%;

padding:12px;

border:none;

border-radius:20px;

background:

linear-gradient(
120deg,
#8b5cf6,
#a855f7,
#7c3aed
);

color:white;

margin-top:15px;

cursor:pointer;

}



.break{

background:rgba(255,255,255,0.2);

padding:10px;

border-radius:10px;

margin:8px 0;

text-align:center;

}

</style>



<link rel="stylesheet" href="superfast-clean-ui.css">
<link rel="stylesheet" href="ultra-ui.css">
</head>



<body>



<div class="container">


<h2 id="dayTitle"></h2>


<div id="inputs"></div>


<button onclick="nextDay()">

Next Day

</button>


</div>



<script src="superfast-ui.js" defer></script>
<script src="ultra-ui.js" defer></script>
</body>

</html>
