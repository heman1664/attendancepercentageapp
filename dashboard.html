<!DOCTYPE html>

<html>

<head>

<title>Select Semester</title>

<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Segoe UI;

background:

linear-gradient(
rgba(70,0,120,0.65),
rgba(30,0,80,0.85)
),

url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

background-size:cover;

background-position:center;

}



/* glass container */

.container{

width:420px;

padding:35px;

border-radius:20px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(15px);

box-shadow:0 0 30px rgba(0,0,0,0.3);

text-align:center;

}



/* title */

h2{

color:white;

margin-bottom:25px;

}



/* grid */

.sem-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:15px;

}



/* button style */

.sem-btn{

padding:18px;

border-radius:15px;

border:none;

font-size:18px;

cursor:pointer;

color:white;

background:

linear-gradient(
120deg,
#8b5cf6,
#a855f7,
#7c3aed
);

background-size:250%;

transition:0.3s;

box-shadow:0 0 15px rgba(0,0,0,0.25);

}



/* hover animation */

.sem-btn:hover{

animation:gradientMove 2s linear infinite;

transform:translateY(-3px);

box-shadow:0 8px 20px rgba(0,0,0,0.35);

}



/* click animation */

.sem-btn:active{

transform:scale(0.95);

}



/* gradient animation */

@keyframes gradientMove{

0%{background-position:0%}
100%{background-position:200%}

}



/* semester number glow */

.sem-btn span{

font-weight:bold;

font-size:20px;

}

</style>

<link rel="stylesheet" href="superfast-clean-ui.css">
<link rel="stylesheet" href="ultra-ui.css">
</head>



<body>



<div class="container">

<h2>Select Semester</h2>



<div class="sem-grid">

<button class="sem-btn" onclick="openSem(1)">
<span>1</span>
</button>

<button class="sem-btn" onclick="openSem(2)">
<span>2</span>
</button>

<button class="sem-btn" onclick="openSem(3)">
<span>3</span>
</button>

<button class="sem-btn" onclick="openSem(4)">
<span>4</span>
</button>

<button class="sem-btn" onclick="openSem(5)">
<span>5</span>
</button>

<button class="sem-btn" onclick="openSem(6)">
<span>6</span>
</button>

<button class="sem-btn" onclick="openSem(7)">
<span>7</span>
</button>

<button class="sem-btn" onclick="openSem(8)">
<span>8</span>
</button>

</div>

</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
get,
child
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

authDomain: "attendance-tracker-7256b.firebaseapp.com",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com",

projectId: "attendance-tracker-7256b",

storageBucket: "attendance-tracker-7256b.appspot.com",

messagingSenderId: "512459479971",

appId: "1:512459479971:web:3e69c4b1cc84388fce9816"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


window.openSem = async function(n){


localStorage.setItem(
"currentSem",
n
);


let snap =
await get(

child(ref(db),

"semesters/"+n+"/timetable")

);


if(snap.exists()){


window.location="attendance-type.html";

}
else{


window.location="add-subject.html";

}


}

</script>



<script src="superfast-ui.js" defer></script>
<script src="ultra-ui.js" defer></script>
</body>

</html>
