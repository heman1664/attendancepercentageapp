<!DOCTYPE html>
<html>

<head>

<title>Placement Attendance</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
update
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

authDomain: "attendance-tracker-7256b.firebaseapp.com",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com",

projectId: "attendance-tracker-7256b",

storageBucket: "attendance-tracker-7256b.appspot.com",

messagingSenderId: "512459479971",

appId: "1:512459479971:web:3e69c4b1cc84388fce9816"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const sem =
localStorage.getItem("currentSem");


let selectedDate="";
let selectedStatus="";



/* choose */

window.choose=function(status){

selectedDate =
document.getElementById("date").value;


if(!selectedDate){

alert("Select date");

return;

}


selectedStatus = status;


document.getElementById("preview")
.innerHTML =

selectedDate + " → " + status;

};



/* update */

window.updateServer = async function(){

if(!selectedStatus){

alert("Select attendance");

return;

}


await update(

ref(db,
"semesters/"+sem+
"/placement/"+selectedDate),

{

status:selectedStatus

}

);


document.getElementById("preview")
.innerHTML="Saved to server";

};

</script>



<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Segoe UI;

background:

linear-gradient(
rgba(70,0,120,0.8),
rgba(30,0,80,0.9)
);

}



.box{

padding:30px;

border-radius:15px;

background:rgba(255,255,255,0.1);

color:white;

text-align:center;

width:260px;

}



button{

border:none;

padding:10px 18px;

border-radius:20px;

margin:6px;

cursor:pointer;

}



.present{

background:#16a34a;

color:white;

}



.absent{

background:#dc2626;

color:white;

}



.holiday{

background:#eab308;

color:black;

}



.update{

width:100%;

background:

linear-gradient(
120deg,
#8b5cf6,
#a855f7,
#7c3aed
);

color:white;

margin-top:12px;

}

</style>

<link rel="stylesheet" href="superfast-clean-ui.css">
<link rel="stylesheet" href="ultra-ui.css">
</head>



<body>



<div class="box">

<h3>Placement Attendance</h3>

<input type="date" id="date">

<br>


<button class="present"
onclick="choose('present')">

Present

</button>


<button class="absent"
onclick="choose('absent')">

Absent

</button>


<button class="holiday"
onclick="choose('leave')">

Holiday

</button>


<p id="preview"></p>


<button class="update"
onclick="updateServer()">

Update Server

</button>


</div>



<script src="superfast-ui.js" defer></script>
<script src="ultra-ui.js" defer></script>
</body>

</html>
