<!DOCTYPE html>
<html>

<head>

<title>Student Attendance</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
get
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey:"AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);


/* semester */

let sem =
localStorage.getItem("viewSem") || "1";

sem = sem.replace("sem","");


let attendanceData={};
let timetable={};
let placementData={};
let holidayData={};
let examHolidayData={};



async function loadDatabase(){

attendanceData =
(
await get(
ref(db,
"semesters/"+sem+"/attendance")
)
).val() || {};


timetable =
(
await get(
ref(db,
"semesters/"+sem+"/timetable")
)
).val() || {};


placementData =
(
await get(
ref(db,
"semesters/"+sem+"/placement")
)
).val() || {};


holidayData =
(
await get(
ref(db,
"semesters/"+sem+"/holidays")
)
).val() || {};


examHolidayData =
(
await get(
ref(db,
"semesters/"+sem+"/examHoliday")
)
).val() || {};

}



/* SEARCH */

window.searchAttendance =
async function(){

await loadDatabase();

let from =
document.getElementById("from").value;

let to =
document.getElementById("to").value;

if(!from || !to){

alert("Select date");

return;

}

generateDaily(from,to);

generateSummary(from,to);

generateHourly(from,to);

generateSubject(from,to);

generatePlacement(from,to);

generatePlacementSummary(from,to);

};



/* DAILY TABLE */

function generateDaily(from,to){

let start=new Date(from);

let end=new Date(to);

let html="";

let i=1;

while(start<=end){

let date=
start.toISOString().split("T")[0];

let day=
new Date(date)
.toLocaleDateString(
'en-US',
{weekday:'long'}
);

let status="Absent";


if(
day=="Sunday" ||
holidayData[date]
){

status="Holiday";

}

else if(
attendanceData[date]?.fullDay=="present"
)

status="Present";


else if(
attendanceData[date]?.fullDay=="leave"
)

status="Holiday";


html+=`

<tr>

<td>${i}</td>

<td>${date}</td>

<td>${day}</td>

<td class="${
status=="Present"?"present":
status=="Absent"?"absent":"holiday"
}">

${status}

</td>

</tr>

`;

i++;

start.setDate(start.getDate()+1);

}

document
.getElementById("dailyTable")
.innerHTML=html;

}



/* DAILY SUMMARY */

function generateSummary(from,to){

let start=new Date(from);

let end=new Date(to);

let working=0;
let present=0;
let absent=0;
let holiday=0;

while(start<=end){

let date=
start.toISOString().split("T")[0];

let day=
new Date(date)
.toLocaleDateString(
'en-US',
{weekday:'long'}
);


if(
day=="Sunday" ||
holidayData[date]
){

holiday++;

}


else if(
attendanceData[date]?.fullDay=="leave"
){

holiday++;

}


else{

working++;

if(
attendanceData[date]?.fullDay=="present"
)

present++;

else

absent++;

}


start.setDate(
start.getDate()+1
);

}


let percent=
working==0?0:
((present/working)*100)
.toFixed(2);


document.getElementById("summaryBox")
.innerHTML=

`

<div class="grid">

<div>

<span class="label">

Start Date :

</span>

${from}

</div>


<div>

<span class="label">

End Date :

</span>

${to}

</div>


<div>

<span class="label">

Working Days :

</span>

${working}

</div>


<div>

<span class="label">

Present :

</span>

<span class="green">

${present}

</span>

</div>


<div>

<span class="label">

Absent :

</span>

<span class="red">

${absent}

</span>

</div>


<div>

<span class="label">

Holidays :

</span>

${holiday}

</div>


<div>

<span class="label">

Attendance % :

</span>

<span class="red">

${percent} %

</span>

</div>


</div>

`;

}



/* HOURLY DETAIL */

function generateHourly(from,to){

let start=new Date(from);
let end=new Date(to);

let html="";
let i=1;

while(start<=end){

let date=start.toISOString().split("T")[0];

let day=new Date(date)
.toLocaleDateString('en-US',{weekday:'long'});


if(day=="Sunday" || holidayData?.[date]){

start.setDate(start.getDate()+1);
continue;

}


let subjects=timetable[day] || [];

let total=0;
let present=0;
let absent=0;


subjects.forEach((sub,index)=>{

if(sub=="break" || sub=="lunch") return;


/* exam holiday period */
if(examHolidayData?.[date]?.["period"+index])
return;


/* full day present */
if(attendanceData?.[date]?.fullDay=="present"){

total++;
present++;
return;

}


/* full day absent */
if(attendanceData?.[date]?.fullDay=="absent"){

total++;
absent++;
return;

}


/* hourly */

let val=
attendanceData?.[date]?.hourly?.["period"+index];


if(val=="present"){

total++;
present++;

}

else if(val=="absent"){

total++;
absent++;

}


/* if not marked ignore */

});


if(total>0){

html+=`

<tr>

<td>${i}</td>

<td>${date}</td>

<td>${total}</td>

<td class="green">${present}</td>

<td class="red">${absent}</td>

</tr>

`;

i++;

}


start.setDate(start.getDate()+1);

}


document.getElementById("hourTable").innerHTML=html;

}



/* SUBJECT SUMMARY */

function generateSubject(from,to){

let start=new Date(from);
let end=new Date(to);

let data={};

while(start<=end){

let date=start.toISOString().split("T")[0];

let day=new Date(date)
.toLocaleDateString('en-US',{weekday:'long'});


if(day=="Sunday" || holidayData?.[date]){

start.setDate(start.getDate()+1);
continue;

}


let subjects=timetable[day] || [];


subjects.forEach((sub,index)=>{


if(sub=="break" || sub=="lunch")
return;


/* exam holiday period */
if(examHolidayData?.[date]?.["period"+index])
return;


/* create subject */
if(!data[sub]){

data[sub]={
total:0,
present:0,
absent:0
};

}


/* full day present */
if(attendanceData?.[date]?.fullDay=="present"){

data[sub].total++;
data[sub].present++;

return;

}


/* full day absent */
if(attendanceData?.[date]?.fullDay=="absent"){

data[sub].total++;
data[sub].absent++;

return;

}


/* hourly */

let val=
attendanceData?.[date]?.hourly?.["period"+index];


if(val=="present"){

data[sub].total++;
data[sub].present++;

}

else if(val=="absent"){

data[sub].total++;
data[sub].absent++;

}


/* if not marked ignore */

});


start.setDate(start.getDate()+1);

}


let html="";

for(let sub in data){

let s=data[sub];

let percent=
s.total==0?0:
((s.present/s.total)*100).toFixed(1);


html+=`

<tr>

<td>${sub}</td>

<td>${s.total}</td>

<td class="green">${s.present}</td>

<td class="red">${s.absent}</td>

<td>${percent}%</td>

</tr>

`;

}


document.getElementById("subjectTable").innerHTML=html;

}


/* PLACEMENT */

function generatePlacement(from,to){

let start=new Date(from);

let end=new Date(to);

let html="";

let i=1;

while(start<=end){

let date=
start.toISOString().split("T")[0];

let day=
new Date(date)
.toLocaleDateString(
'en-US',
{weekday:'long'}
);

if(placementData?.[date]){

let status=
placementData[date].status;


html+=`

<tr>

<td>${i}</td>

<td>${date}</td>

<td>${day}</td>

<td class="${
status=="present"
?"present":"absent"
}">

${status}

</td>

</tr>

`;

i++;

}

start.setDate(start.getDate()+1);

}


document
.getElementById("placementTable")
.innerHTML=html;

}



/* PLACEMENT SUMMARY */

function generatePlacementSummary(from,to){

let start=new Date(from);

let end=new Date(to);

let total=0;
let present=0;
let absent=0;

while(start<=end){

let date=
start.toISOString().split("T")[0];

if(placementData?.[date]){

total++;

if(
placementData[date].status=="present"
)

present++;

else

absent++;

}


start.setDate(start.getDate()+1);

}


let percent=
total==0?0:
((present/total)*100)
.toFixed(2);


document
.getElementById("placementSummary")
.innerHTML=

`

<div class="grid">

<div>

Placement Days :
${total}

</div>


<div>

Present :
<span class="green">

${present}

</span>

</div>


<div>

Absent :
<span class="red">

${absent}

</span>

</div>


<div>

Percentage :
${percent} %

</div>

</div>

`;

}



/* TABS */

function show(id){

document
.querySelectorAll(".box")
.forEach(e=>e.style.display="none");

document
.getElementById(id)
.style.display="block";

}

window.show=show;

</script>
