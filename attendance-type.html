<!DOCTYPE html>

<html>

<head>

<title>Attendance</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
child
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

authDomain: "attendance-tracker-7256b.firebaseapp.com",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com",

projectId: "attendance-tracker-7256b",

storageBucket: "attendance-tracker-7256b.appspot.com",

messagingSenderId: "512459479971",

appId: "1:512459479971:web:3e69c4b1cc84388fce9816"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const sem =
localStorage.getItem("currentSem");


const todayName =
new Date().toLocaleDateString(
'en-US',
{ weekday:'long' }
);


const todayDate =
new Date().toISOString().split("T")[0];


document.addEventListener("DOMContentLoaded",()=>{

document.getElementById("todayText")
.innerHTML =
todayDate+" ("+todayName+")";

});


let attendanceData={};

let confirmData={};



/* sunday holiday auto */

if(todayName=="Sunday"){

attendanceData={

fullDay:"leave"

};


set(

ref(db,
"semesters/"+sem+
"/attendance/"+todayDate),

attendanceData

);

}



/* load subjects */

async function getTodaySubjects(){

let snap =
await get(

child(
ref(db),
"semesters/"+sem+"/timetable"

)

);


let timetable =
snap.val();


if(!timetable[todayName]){

document.getElementById("result")
.innerHTML="No classes today";

return [];

}


return timetable[todayName];

}



/* DAILY */

window.showDaily = async function(){

document.getElementById("dailyBox")
.style.display="block";

document.getElementById("hourlyBox")
.style.display="none";


let subjects =
await getTodaySubjects();


let html="";


subjects.forEach((sub)=>{

if(sub!="break" && sub!="lunch"){

html+=`

<div class="row">

${sub}

<div>

<button class="present"

onclick="openConfirm('daily','present','${sub}')">

Present

</button>


<button class="absent"

onclick="openConfirm('daily','absent','${sub}')">

Absent

</button>

</div>

</div>

`;

}

});


document.getElementById("subjectList")
.innerHTML=html;

};



/* HOURLY */

window.showHourly = async function(){

document.getElementById("hourlyBox")
.style.display="block";

document.getElementById("dailyBox")
.style.display="none";


let subjects =
await getTodaySubjects();


let html="";


subjects.forEach((sub,i)=>{


html+=`

<div class="row">

Period ${i+1} - ${sub}

<div>

<button class="present"

onclick="openConfirm('hourly','present','${sub}',${i})">

P

</button>


<button class="absent"

onclick="openConfirm('hourly','absent','${sub}',${i})">

A

</button>

</div>

</div>

`;

});


document.getElementById("hourList")
.innerHTML=html;

};



/* confirm popup */

window.openConfirm=function(type,status,subject,index){

confirmData={

type,
status,
subject,
index

};


document.getElementById("dialogMsg")
.innerHTML=

subject+"<br>"+status;


document.getElementById("dialog")
.style.display="flex";

};



window.confirmYes=function(){

document.getElementById("dialog")
.style.display="none";


if(confirmData.type=="daily"){

attendanceData[confirmData.subject]=
confirmData.status;

}


if(confirmData.type=="hourly"){

attendanceData["period"+
confirmData.index]={

subject:
confirmData.subject,

status:
confirmData.status

};

}


document.getElementById("result")
.innerHTML="Saved locally";

};



/* save */

window.updateAttendance = async function(){

await set(

ref(db,
"semesters/"+sem+
"/attendance/"+todayDate),

attendanceData

);


alert("Updated successfully");

};



/* edit */

window.editPrev=function(){

window.location="edit-attendance.html";

};

</script>



<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Segoe UI;

background:

linear-gradient(
rgba(70,0,120,0.65),
rgba(30,0,80,0.85)
),

url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

background-size:cover;

}



/* box */

.container{

width:380px;

padding:35px;

border-radius:20px;

background:rgba(255,255,255,0.1);

backdrop-filter:blur(15px);

color:white;

text-align:center;

}



/* button */

button{

padding:10px;

border:none;

border-radius:25px;

margin:6px;

cursor:pointer;

}



.main{

width:100%;

background:

linear-gradient(
120deg,
#8b5cf6,
#a855f7,
#7c3aed
);

color:white;

}



/* attendance */

.present{

background:#16a34a;

color:white;

}



.absent{

background:#dc2626;

color:white;

}



/* rows */

.row{

display:flex;

justify-content:space-between;

align-items:center;

margin:10px 0;

}



/* popup */

.dialog{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,0.5);

display:none;

justify-content:center;

align-items:center;

}



.dialog-box{

background:white;

padding:20px;

border-radius:10px;

color:black;

}

</style>



<link rel="stylesheet" href="superfast-clean-ui.css">
<link rel="stylesheet" href="ultra-ui.css">
</head>



<body>



<div class="container">


<h2>

Attendance

</h2>


<h4 id="todayText"></h4>



<button class="main"
onclick="showDaily()">

Daily Attendance

</button>



<button class="main"
onclick="showHourly()">

Hourly Attendance

</button>



<button class="main"
onclick="editPrev()">

Edit Previous Attendance

</button>



<div id="dailyBox"
style="display:none">


<div id="subjectList"></div>


</div>



<div id="hourlyBox"
style="display:none">


<div id="hourList"></div>


</div>



<button class="main"
onclick="updateAttendance()">

Update Server

</button>



<p id="result"></p>



</div>



<div id="dialog"
class="dialog">


<div class="dialog-box">


<p id="dialogMsg"></p>



<button onclick="confirmYes()">

Confirm

</button>



</div>


</div>



<script src="superfast-ui.js" defer></script>
<script src="ultra-ui.js" defer></script>
</body>

</html>
