<!DOCTYPE html>

<html>

<head>

<title>Timetable</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
child
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

authDomain: "attendance-tracker-7256b.firebaseapp.com",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com",

projectId: "attendance-tracker-7256b",

storageBucket: "attendance-tracker-7256b.appspot.com",

messagingSenderId: "512459479971",

appId: "1:512459479971:web:3e69c4b1cc84388fce9816"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const sem =
localStorage.getItem("currentSem");


async function load(){


let t1 =
await get(

child(ref(db),

"semesters/"+sem+"/timetable")

);


let timetable =
t1.val();


let t2 =
await get(

child(ref(db),

"semesters/"+sem+"/timings")

);


let timings=[];


t2.forEach(x=>{

timings.push(x.val());

});


let html=
"<table border=1>";


html+="<tr>";

html+="<th>Day</th>";


timings.forEach((t,i)=>{

html+=
"<th>"+(i+1)+"<br>"+
t.start+"-"+t.end+
"</th>";

});


html+="</tr>";


for(let d in timetable){

html+="<tr>";

html+="<td>"+d+"</td>";

timetable[d].forEach(p=>{

html+="<td>"+p+"</td>";

});

html+="</tr>";

}


html+="</table>";


document.getElementById("table")
.innerHTML = html;


}


load();




/* save semester start date */

window.updateServer = async function(){


let startDate =
document.getElementById("startDate").value;


await set(

ref(db,
"semesters/"+sem+"/startDate"),

startDate

);


alert("Semester saved");


window.location="dashboard.html";


}

</script>



<style>

body{

font-family:Segoe UI;

padding:40px;

}



table{

border-collapse:collapse;

width:100%;

margin-bottom:20px;

}



td,th{

padding:10px;

text-align:center;

}



button{

padding:10px 20px;

margin-top:10px;

}

</style>



<link rel="stylesheet" href="superfast-clean-ui.css">
<link rel="stylesheet" href="ultra-ui.css">
</head>



<body>



<h2>

Semester Timetable

</h2>


<div id="table"></div>



<label>

Semester Start Date

</label>

<br><br>


<input
type="date"
id="startDate">


<br><br>


<button onclick="updateServer()">

Update Server

</button>



<script src="superfast-ui.js" defer></script>
<script src="ultra-ui.js" defer></script>
</body>

</html>
