<!DOCTYPE html>

<html>

<head>

<title>Add Subjects</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";

import {
getDatabase,
ref,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",

authDomain: "attendance-tracker-7256b.firebaseapp.com",

databaseURL:
"https://attendance-tracker-7256b-default-rtdb.firebaseio.com",

projectId: "attendance-tracker-7256b",

storageBucket: "attendance-tracker-7256b.appspot.com",

messagingSenderId: "512459479971",

appId: "1:512459479971:web:3e69c4b1cc84388fce9816"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* selected semester */

const sem =
localStorage.getItem("currentSem");

document.getElementById("semTitle").innerText =
"Semester " + sem;


/* add subject */

window.addSubject = function(){

const name =
document.getElementById("subName").value;

const hrs =
document.getElementById("hrs").value;


/* confirm dialog */

document.getElementById("dialogText").innerHTML =

"Subject : <b>"+name+"</b><br>"+
"Hours : "+hrs+" hour";


document.getElementById("dialog")
.style.display="flex";


window.confirmAdd = function(){

push(

ref(db,
"semesters/"+sem+"/subjects"),

{
name:name,
hrs:hrs
}

);


/* clear input */

document.getElementById("subName").value="";

document.getElementById("dialog")
.style.display="none";

};

};


/* realtime display */

onValue(

ref(db,
"semesters/"+sem+"/subjects"),

(snapshot)=>{

let html="";

snapshot.forEach(child=>{

let s = child.val();

html +=

"<div class='sub-item'>"+
s.name+" ("+s.hrs+"hr)"+
"</div>";

});

document.getElementById("list")
.innerHTML = html;

}

);

</script>



<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Segoe UI;

background:

linear-gradient(
rgba(70,0,120,0.65),
rgba(30,0,80,0.85)
),

url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

background-size:cover;

}



/* glass box */

.container{

width:340px;

padding:35px 30px;

border-radius:22px;

background:rgba(255,255,255,0.10);

backdrop-filter:blur(15px);

box-shadow:0 8px 30px rgba(0,0,0,0.35);

text-align:center;

}



h2{

color:white;

margin-bottom:20px;

}



input,
select{

width:100%;

padding:12px 16px;

margin:10px 0;

border-radius:25px;

border:none;

outline:none;

font-size:14px;

background:rgba(255,255,255,0.85);

box-sizing:border-box;

}



/* gradient button */

button{

width:100%;

padding:12px;

margin-top:12px;

border:none;

border-radius:25px;

font-size:15px;

cursor:pointer;

color:white;

background:

linear-gradient(
120deg,
#8b5cf6,
#a855f7,
#7c3aed
);

background-size:250%;

transition:0.3s;

}


button:hover{

animation:move 2s linear infinite;

}



@keyframes move{

0%{background-position:0%}
100%{background-position:200%}

}



/* subject list */

.sub-item{

background:rgba(255,255,255,0.15);

padding:8px;

margin:6px;

border-radius:10px;

color:white;

}



/* dialog */

.dialog{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

display:none;

justify-content:center;

align-items:center;

background:rgba(0,0,0,0.4);

}



.dialog-box{

background:white;

padding:20px;

border-radius:12px;

width:250px;

}

</style>



<link rel="stylesheet" href="superfast-clean-ui.css">
<link rel="stylesheet" href="ultra-ui.css">
</head>



<body>



<div class="container">

<h2 id="semTitle"></h2>



<input id="subName"
placeholder="Subject name">



<select id="hrs">

<option value="1">
1 hour
</option>

<option value="2">
2 hour
</option>

</select>



<button onclick="addSubject()">

Add Subject

</button>



<div id="list"></div>



<button onclick="window.location='add-timing.html'">

Next → Add Timings

</button>



</div>



<!-- confirm dialog -->

<div id="dialog" class="dialog">

<div class="dialog-box">

<p id="dialogText"></p>

<button onclick="confirmAdd()">

Confirm

</button>

</div>

</div>



<script src="superfast-ui.js" defer></script>
<script src="ultra-ui.js" defer></script>
</body>

</html>
