<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Hourly Attendance</title><link rel="stylesheet" href="superfast-clean-ui.css"><link rel="stylesheet" href="ultra-ui.css">
<style>
:root{--green:#16a34a;--red:#dc2626;--purple:#8b5cf6;--blue:#6366f1}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;display:flex;justify-content:center;padding:20px;background:radial-gradient(circle at 12% 0,rgba(124,58,237,.27),transparent 34%),radial-gradient(circle at 90% 18%,rgba(37,99,235,.20),transparent 32%),linear-gradient(145deg,#060d1b,#0b1730);color:#f8fafc;font-family:Inter,Segoe UI,system-ui,sans-serif}.shell{width:min(900px,96vw);height:calc(100vh - 40px);min-height:620px;display:flex;flex-direction:column;padding:24px;border:1px solid rgba(255,255,255,.13);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));backdrop-filter:blur(24px) saturate(135%);box-shadow:0 30px 90px rgba(0,0,0,.42);overflow:hidden}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.eyebrow{margin:0 0 6px;color:#a78bfa;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.head h1{margin:0;font-size:28px}.head p{margin:7px 0 0;color:#94a3b8;font-size:13px}.back{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;text-decoration:none;font-size:20px}.toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;margin-bottom:6px;color:#aebbd0;font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.field input{width:100%;height:44px;padding:0 12px;border-radius:13px;background:rgba(2,6,23,.40);color:#fff;border:1px solid rgba(255,255,255,.13);outline:none}.field input:focus{border-color:rgba(167,139,250,.65);box-shadow:0 0 0 3px rgba(139,92,246,.13)}button{font:inherit}.load,.update{height:44px;border:0;border-radius:13px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--blue));cursor:pointer;transition:transform .16s,filter .16s}.load:hover,.update:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}.summary{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:13px 0;padding:12px 14px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:rgba(255,255,255,.045);font-size:12px;color:#cbd5e1}.summary strong{color:#fff}.legend{display:flex;gap:12px}.legend span{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%}.p-dot{background:var(--green)}.a-dot{background:var(--red)}.list{flex:1;min-height:0;overflow-y:auto;padding:2px 6px 10px 1px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#7054d9 rgba(255,255,255,.035)}.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-track{background:rgba(255,255,255,.035);border-radius:99px}.list::-webkit-scrollbar-thumb{background:linear-gradient(#8b5cf6,#4f46e5);border-radius:99px;border:2px solid transparent;background-clip:padding-box}.day{margin-bottom:12px;padding:12px;border:1px solid rgba(255,255,255,.075);border-radius:18px;background:rgba(255,255,255,.045)}.day-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 9px}.date{font-size:14px;font-weight:900}.dayname{color:#94a3b8;font-size:11px;font-weight:700}.subject-row{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:7px;padding:11px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.045);transition:background .16s,border-color .16s,transform .16s}.subject-row:hover{background:rgba(255,255,255,.07);border-color:rgba(139,92,246,.24);transform:translateX(1px)}.period{height:30px;display:grid;place-items:center;border-radius:9px;background:rgba(139,92,246,.16);color:#c4b5fd;font-size:11px;font-weight:900}.subject{min-width:0;color:#eef2f7;font-size:14px;font-weight:750;line-height:1.3}.actions{display:flex;gap:8px}.status{width:40px;height:40px;border-radius:50%;border:2px solid transparent;color:#fff;font-size:14px;font-weight:950;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s}.status.p{background:var(--green)}.status.a{background:var(--red)}.status.selected{border:3px solid #fff;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 0 20px rgba(255,255,255,.16);transform:scale(1.07)}.status:hover{transform:translateY(-1px)}.status.selected:hover{transform:scale(1.07) translateY(-1px)}.footer{padding-top:12px}.update{width:100%;height:48px;font-size:14px}.update:disabled{opacity:.48;cursor:not-allowed}.empty{padding:40px 20px;text-align:center;color:#94a3b8;border:1px dashed rgba(255,255,255,.12);border-radius:16px}.empty strong{display:block;color:#e2e8f0;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:12px 16px;border-radius:12px;background:rgba(15,23,42,.96);border:1px solid rgba(255,255,255,.13);color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){body{padding:10px}.shell{width:100%;height:calc(100vh - 20px);min-height:0;padding:16px;border-radius:22px}.toolbar{grid-template-columns:1fr 1fr}.load{grid-column:1/-1}.summary{align-items:flex-start;flex-direction:column}.subject-row{grid-template-columns:42px minmax(0,1fr) auto}.subject{font-size:12px}.status{width:36px;height:36px}}
</style></head><body><main class="shell"><header class="head"><div><p class="eyebrow">Attendance Editor</p><h1>Hourly Attendance</h1><p>Existing attendance is highlighted with a white border.</p></div><a class="back" href="edit-attendance.html">×</a></header><section class="toolbar"><div class="field"><label>From date</label><input id="from" type="date"></div><div class="field"><label>To date</label><input id="to" type="date"></div><button class="load" id="loadBtn">Load</button></section><div class="summary"><div><strong id="rangeText">Select a date range</strong><span id="countText"> · 0 classes</span></div><div class="legend"><span><i class="dot p-dot"></i>Present</span><span><i class="dot a-dot"></i>Absent</span></div></div><main id="list" class="list"><div class="empty"><strong>Ready when you are</strong>Select a date range to load subjects.</div></main><footer class="footer"><button class="update" id="updateBtn" disabled>Update Server</button></footer></main><div id="toast" class="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCLdqMLxR9ZKEeS6zDHv-rkbSt-PTbDtMc",authDomain:"attendance-tracker-7256b.firebaseapp.com",databaseURL:"https://attendance-tracker-7256b-default-rtdb.firebaseio.com",projectId:"attendance-tracker-7256b",storageBucket:"attendance-tracker-7256b.appspot.com",messagingSenderId:"512459479971",appId:"1:512459479971:web:3e69c4b1cc84388fce9816"};
const app=initializeApp(firebaseConfig),db=getDatabase(app),sem=localStorage.getItem("currentSem");
let timetable={},attendance={},placement={},edits={};
const $=id=>document.getElementById(id); const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function localISO(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dayName(s){return parseDate(s).toLocaleDateString('en-US',{weekday:'long'})}
function normalize(v){if(typeof v==='string'){v=v.toLowerCase(); if(v==='p'||v==='present')return 'present'; if(v==='a'||v==='absent')return 'absent'} if(v&&typeof v==='object') return normalize(v.status); return ''}
function savedStatus(date,index){const edit=edits?.[date]?.[`period${index}`]; if(edit)return edit; const e=attendance?.[date]||{}; return normalize(e?.hourly?.[`period${index}`])||normalize(e?.[`period${index}`])}
async function loadBase(){if(!sem){throw new Error('No current semester selected')} const [t,a,p]=await Promise.all([get(ref(db,`semesters/${sem}/timetable`)),get(ref(db,`semesters/${sem}/attendance`)),get(ref(db,`semesters/${sem}/placement`))]); timetable=t.val()||{};attendance=a.val()||{};placement=p.val()||{}}
function render(){const from=$('from').value,to=$('to').value;if(!from||!to)return;let html='',classes=0,days=0;for(let cur=parseDate(from);cur<=parseDate(to);cur.setDate(cur.getDate()+1)){const date=localISO(cur),name=dayName(date);days++;const subjects=Array.isArray(timetable[name])?timetable[name]:[];const rows=subjects.map((raw,i)=>({raw:String(raw??'').trim(),i})).filter(x=>x.raw&&x.raw.toLowerCase()!=='break'&&x.raw.toLowerCase()!=='lunch');classes+=rows.length;html+=`<section class="day"><div class="day-head"><span class="date">${esc(date)}</span><span class="dayname">${esc(name)}</span></div>`;if(!rows.length)html+=`<div class="empty">No classes scheduled for this day.</div>`;for(const {raw,i} of rows){const saved=savedStatus(date,i);html+=`<div class="subject-row" data-date="${date}" data-period="${i}"><span class="period">P${i+1}</span><span class="subject" title="${esc(raw)}">${esc(raw)}</span><div class="actions"><button class="status p ${saved==='present'?'selected':''}" data-status="present">P</button><button class="status a ${saved==='absent'?'selected':''}" data-status="absent">A</button></div></div>`}html+=`</section>`} $('list').innerHTML=html||`<div class="empty"><strong>No classes found</strong>There are no timetable entries in this range.</div>`;$('rangeText').textContent=`${from} → ${to}`;$('countText').textContent=` · ${classes} class${classes===1?'':'es'} across ${days} day${days===1?'':'s'}`;$('updateBtn').disabled=Object.keys(edits).length===0}
$('list').addEventListener('click',e=>{const btn=e.target.closest('.status');if(!btn)return;const row=btn.closest('.subject-row');const date=row.dataset.date,index=row.dataset.period,status=btn.dataset.status;edits[date]??={};edits[date][`period${index}`]=status;row.querySelectorAll('.status').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');$('updateBtn').disabled=false});
async function loadDates(){const from=$('from').value,to=$('to').value;if(!from||!to){toast('Select both dates');return}if(from>to){toast('From date must be before To date');return}$('loadBtn').disabled=true;$('loadBtn').textContent='Loading…';try{await loadBase();edits={};render()}catch(e){console.error(e);toast('Could not load Firebase data')}finally{$('loadBtn').disabled=false;$('loadBtn').textContent='Load'}}
async function updateServer(){const dates=Object.keys(edits);if(!dates.length){toast('No changes to update');return}const btn=$('updateBtn');btn.disabled=true;btn.textContent='Updating…';try{const patch={};for(const date of dates){for(const [period,status] of Object.entries(edits[date]||{}))patch[`${date}/hourly/${period}`]=status}await update(ref(db,`semesters/${sem}/attendance`),patch);for(const date of dates){attendance[date]??={};attendance[date].hourly??={};Object.assign(attendance[date].hourly,edits[date])}edits={};toast('Hourly attendance updated successfully');render()}catch(e){console.error('Hourly update failed:',e);toast(`Update failed: ${e?.message||'check Firebase connection/rules'}`);btn.disabled=false}finally{btn.textContent='Update Server';if(Object.keys(edits).length===0)btn.disabled=true}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2600)}
$('loadBtn').addEventListener('click',loadDates);$('updateBtn').addEventListener('click',updateServer);const today=localISO();$('from').value=today;$('to').value=today;
</script><script src="superfast-ui.js" defer></script><script src="ultra-ui.js" defer></script></body></html>
